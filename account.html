<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 정보 | 헤리움 케어센터</title>
    <link rel="stylesheet" href="main.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="top-bar">
    <div class="user-menu">
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
    </div>
</div>
<div class="header-top-row">
    <div class="header-top-inner">
        <div class="logo">
            <a href="main.html"><img src="img/logo.png" alt="홈페이지 로고"></a>
        </div>
    </div>
</div>
<div class="auth-wrap">
    <div class="auth-inner">
        <section class="auth-hero">
            <span class="eyebrow">내 정보</span>
            <h1>헤리움 <span>보호자 정보</span></h1>
            <p>여기서 바꾸는 보호자 성함은 의료기 주문자 이름과 따로 저장됩니다.</p>
        </section>
        <section class="auth-card">
            <h2>개인정보</h2>
            <div class="auth-message" id="authMessage"></div>
            <form id="accountForm">
                <div class="auth-field">
                    <label for="accountId">아이디</label>
                    <div class="auth-input">
                        <i class="fas fa-user field-icon"></i>
                        <input type="text" id="accountId" name="id" readonly>
                    </div>
                </div>
                <div class="auth-field">
                    <label for="accountName">보호자 성함</label>
                    <div class="auth-input">
                        <i class="fas fa-id-card field-icon"></i>
                        <input type="text" id="accountName" name="name" placeholder="보호자 성함">
                    </div>
                </div>
                <div class="auth-field">
                    <label for="accountPhone">연락처</label>
                    <div class="auth-input">
                        <i class="fas fa-phone field-icon"></i>
                        <input type="tel" id="accountPhone" name="phone" placeholder="010-0000-0000">
                    </div>
                </div>
                <div class="auth-field">
                    <label for="accountEmail">이메일</label>
                    <div class="auth-input">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="accountEmail" name="email" placeholder="email@example.com">
                    </div>
                </div>
                <div class="auth-field">
                    <label for="accountCurrent">현재 비밀번호</label>
                    <div class="auth-input">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="accountCurrent" name="currentPassword" placeholder="비밀번호를 바꿀 때만 입력">
                        <button type="button" class="toggle-pw" aria-label="비밀번호 보기"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="auth-field">
                    <label for="accountNew">새 비밀번호</label>
                    <div class="auth-input">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="accountNew" name="newPassword" placeholder="바꾸지 않으려면 비워 두세요">
                        <button type="button" class="toggle-pw" aria-label="비밀번호 보기"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="auth-submit">저장</button>
            </form>
        </section>
    </div>
</div>
<script src="auth.js"></script>
</body>
</html>
